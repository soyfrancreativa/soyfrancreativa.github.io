name: Renombrar recetario TUPONKE a index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renombrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar HTML a tuponke/index.html y limpiar temporales
        run: |
          git mv tuponke/recetario-digital-interactivo.html tuponke/index.html
          git rm -q tuponke/placeholder.txt tuponke/test-small.txt
          git status --short
      - name: Commit y push a main
        run: |
          git config user.name "soyfrancreativa"
          git config user.email "soyfrancreativa@users.noreply.github.com"
          git commit -m "Renombrar recetario a tuponke/index.html y limpiar temporales"
          git push
